version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /Telegram/build/docker/centos_env
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Etc/UTC
    labels:
      - dependencies
      - docker
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Etc/UTC
    labels:
      - dependencies
      - docker
    open-pull-requests-limit: 2
