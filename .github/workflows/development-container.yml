name: Development container

on:
  pull_request:
    paths:
      - .devcontainer.json
      - .github/workflows/development-container.yml
      - Telegram/build/docker/centos_env/**
  push:
    branches:
      - dev
    paths:
      - .devcontainer.json
      - .github/workflows/development-container.yml
      - Telegram/build/docker/centos_env/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/ayugram/ayugramdesktop-dev
  DOCKERFILE_DIRECTORY: Telegram/build/docker/centos_env
  GENERATED_DOCKERFILE: Telegram/build/docker/centos_env/Dockerfile.generated

jobs:
  validate:
    name: Validate container definition
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install renderer
        run: python -m pip install --disable-pip-version-check --no-cache-dir poetry==2.1.1

      - name: Render Dockerfile
        working-directory: ${{ env.DOCKERFILE_DIRECTORY }}
        run: |
          poetry install --no-root --only main --sync
          poetry run python gen_dockerfile.py > Dockerfile.generated
          if grep -Eq '\{[%{#]' Dockerfile.generated; then
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Validate build definition
        run: docker buildx build --check --file "${GENERATED_DOCKERFILE}" "${DOCKERFILE_DIRECTORY}"

  publish:
    name: Publish container image
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
      packages: write
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install renderer
        run: python -m pip install --disable-pip-version-check --no-cache-dir poetry==2.1.1

      - name: Render Dockerfile
        working-directory: ${{ env.DOCKERFILE_DIRECTORY }}
        run: |
          poetry install --no-root --only main --sync
          poetry run python gen_dockerfile.py > Dockerfile.generated

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=AyuGram Desktop development container
            org.opencontainers.image.description=Rocky Linux 8 build environment for AyuGram Desktop

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ env.DOCKERFILE_DIRECTORY }}
          file: ${{ env.GENERATED_DOCKERFILE }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=ayugram-rocky-linux-8
          cache-to: type=gha,mode=max,scope=ayugram-rocky-linux-8
          sbom: true
          provenance: mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Scan published image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload vulnerability report
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@3b0bd1d116c0bde30213346b22d4f634d96a2fb0
        with:
          sarif_file: trivy-results.sarif
