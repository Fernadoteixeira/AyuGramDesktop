name: Security execution assurance

on:
  pull_request:
    paths:
      - Telegram/SourceFiles/storage/details/storage_file_utilities.cpp
      - Telegram/SourceFiles/storage/details/storage_file_utilities_kdf_test.cpp
      - Telegram/SourceFiles/ayu/data/ayu_database.cpp
      - Telegram/SourceFiles/ayu/data/ayu_database_test.cpp
      - Telegram/SourceFiles/ayu/data/ayu_database_test_access.h
      - Telegram/cmake/tests.cmake
      - Telegram/build/docker/centos_env/**
      - .github/workflows/security-execution-assurance.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-execution-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-security-runtime:
    name: Linux C++ security runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install Dockerfile renderer
        run: python -m pip install --disable-pip-version-check --no-cache-dir poetry==2.4.1

      - name: Render build environment
        working-directory: Telegram/build/docker/centos_env
        run: |
          poetry sync --no-root --only main
          poetry run python gen_dockerfile.py > Dockerfile.generated
          if grep -Eq '\{[%{#]' Dockerfile.generated; then
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build security toolchain image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: Telegram/build/docker/centos_env
          file: Telegram/build/docker/centos_env/Dockerfile.generated
          platforms: linux/amd64
          load: true
          push: false
          tags: ayugram-security-toolchain:ci
          cache-from: type=gha,scope=ayugram-security-assurance
          cache-to: type=gha,mode=max,scope=ayugram-security-assurance

      - name: Prepare writable build output
        run: |
          mkdir -p out
          chmod 0777 out

      - name: Configure focused security tests
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/usr/src/tdesktop" \
            ayugram-security-toolchain:ci \
            bash -lc 'cd Telegram && ./configure.sh -DDESKTOP_APP_TEST_APPS=ON'

      - name: Build focused security tests
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/usr/src/tdesktop" \
            ayugram-security-toolchain:ci \
            bash -lc 'cmake --build out --target test_storage_kdf test_ayu_database --parallel 4'

      - name: Execute KDF regression suite
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/usr/src/tdesktop" \
            ayugram-security-toolchain:ci \
            bash -lc './out/test_storage_kdf'

      - name: Execute SQLCipher regression suite
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/usr/src/tdesktop" \
            ayugram-security-toolchain:ci \
            bash -lc './out/test_ayu_database'

      - name: Capture dependency versions
        if: always()
        run: |
          grep -nE 'OPENSSL|openssl|FFMPEG|ffmpeg|ENV QT=|QT_SHA' Telegram/build/docker/centos_env/Dockerfile.generated || true

      - name: Evidence summary
        if: always()
        run: |
          {
            echo '## Security Execution Assurance'
            echo
            echo '- Branch: `${{ github.head_ref || github.ref_name }}`'
            echo '- Commit: `${{ github.sha }}`'
            echo '- Required result: both C++ targets compile and both suites exit 0.'
            echo '- This workflow does not publish images and has read-only repository permissions.'
          } >> "$GITHUB_STEP_SUMMARY"
