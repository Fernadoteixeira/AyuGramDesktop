name: Quality 360 verification

on:
  pull_request:
    paths:
      - scripts/run_all_360_gates.py
      - scripts/upstream_reconcile.py
      - scripts/check_mutable_refs.py
      - scripts/verify_*.py
      - scripts/mutable_refs_allowlist.txt
      - tests/logic/**
      - Telegram/SourceFiles/ayu/**
      - .devcontainer/**
      - Telegram/build/docker/centos_env/**
      - .github/workflows/**
      - .gitmodules
      - SUBMODULES.md
      - SECURITY_COMPLIANCE_MATRIX.md
  push:
    branches:
      - dev
    paths:
      - scripts/run_all_360_gates.py
      - scripts/upstream_reconcile.py
      - scripts/check_mutable_refs.py
      - scripts/verify_*.py
      - scripts/mutable_refs_allowlist.txt
      - tests/logic/**
      - Telegram/SourceFiles/ayu/**
      - .devcontainer/**
      - Telegram/build/docker/centos_env/**
      - .github/workflows/**
      - .gitmodules
      - SUBMODULES.md
      - SECURITY_COMPLIANCE_MATRIX.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-360-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-360-suite:
    name: Execute 360 Quality Orchestrator
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install dependencies & linters
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir poetry==2.4.1 Jinja2==3.1.6 ruff==0.16.4 bandit==1.9.4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Execute Master 360 Orchestrator
        run: python scripts/run_all_360_gates.py
